aid: agzen
name: AgZen
description: >-
  AgZen is an MIT spinout building RealCoverage, a sensor- and AI-based system
  that measures and controls how many droplets of crop-protection product land
  on every leaf during agricultural spraying. A boom-mounted computer-vision
  sensor analyzes spray coverage and droplet quality in real time and displays
  actionable data on an in-cab tablet, automatically optimizing foliar sprays on
  any sprayer as the operator drives. Growers use RealCoverage to cut chemical
  and water use by up to 50% while maintaining or improving efficacy and yield,
  with a typical payback in under a year. RealCoverage retrofits onto any
  generation of sprayer and won Crop Protection Solution of the Year in 2025.
  AgZen is headquartered at Greentown Labs in Somerville, Massachusetts and is
  backed by DCVC Bio, Material Impact, Astanor Ventures, and Syngenta Group
  Ventures.
